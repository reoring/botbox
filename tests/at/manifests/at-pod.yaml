---
apiVersion: v1
kind: Namespace
metadata:
  name: botbox-at
---
apiVersion: v1
kind: Secret
metadata:
  name: botbox-secrets
  namespace: botbox-at
type: Opaque
stringData:
  # Intentionally does NOT include the required key "at-secret".
  placeholder: "x"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: botbox-config
  namespace: botbox-at
data:
  config.yaml: |
    listen_addr: "127.0.0.1"
    listen_port: 8080
    metrics_port: 9090
    secrets_dir: "/var/run/secrets/botbox"
    max_connections: 1024
    allow_non_loopback: false

    egress_policy:
      default_action: deny
      rules:
        - host: httpbin.org
          action: allow
          header_rewrites:
            - name: X-AT-Secret
              value: "{value}"
              secret_ref: at-secret
---
apiVersion: v1
kind: Pod
metadata:
  name: botbox-at
  namespace: botbox-at
spec:
  restartPolicy: Never
  initContainers:
    - name: iptables-init
      image: botbox-iptables-init:test
      imagePullPolicy: Never
      env:
        - name: BOTBOX_UID
          value: "1337"
        - name: BOTBOX_PROXY_PORT
          value: "8080"
        - name: BOTBOX_ENABLE_IPV6
          value: "0"
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        capabilities:
          add: [NET_ADMIN]
  containers:
    - name: botbox
      image: botbox:test
      imagePullPolicy: Never
      args:
        - "--config"
        - "/etc/botbox/config.yaml"
      securityContext:
        runAsUser: 1337
        runAsNonRoot: true
        allowPrivilegeEscalation: false
      ports:
        - containerPort: 8080
          name: proxy
        - containerPort: 9090
          name: metrics
      readinessProbe:
        httpGet:
          path: /healthz
          port: 9090
        initialDelaySeconds: 1
        periodSeconds: 2
      volumeMounts:
        - name: secrets
          mountPath: /var/run/secrets/botbox
          readOnly: true
        - name: config
          mountPath: /etc/botbox
          readOnly: true
    - name: client
      image: curlimages/curl:8.11.1
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "sleep infinity"]
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
  volumes:
    - name: secrets
      secret:
        secretName: botbox-secrets
    - name: config
      configMap:
        name: botbox-config
