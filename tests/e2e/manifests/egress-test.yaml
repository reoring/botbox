---
apiVersion: v1
kind: Namespace
metadata:
  name: egress-test
---
apiVersion: v1
kind: Secret
metadata:
  name: botbox-secrets
  namespace: egress-test
type: Opaque
stringData:
  openai-api-key: "REPLACE-ME-NOT-A-REAL-KEY"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: botbox-config
  namespace: egress-test
data:
  config.yaml: |
    listen_addr: "127.0.0.1"
    listen_port: 8080
    metrics_port: 9090
    secrets_dir: "/var/run/secrets/botbox"
    max_connections: 1024

    egress_policy:
      default_action: deny
      rules:
        - host: api.openai.com
          action: allow
          header_rewrites:
            - name: Authorization
              value: "Bearer {value}"
              secret_ref: openai-api-key
---
apiVersion: v1
kind: Pod
metadata:
  name: egress-test
  namespace: egress-test
spec:
  restartPolicy: Never
  initContainers:
    - name: iptables-init
      image: botbox-iptables-init:test
      imagePullPolicy: Never
      env:
        - name: BOTBOX_ENABLE_IPV6
          value: "0"
      securityContext:
        capabilities:
          add: [NET_ADMIN]
        runAsUser: 0
        runAsNonRoot: false
    - name: botbox
      image: botbox:test
      imagePullPolicy: Never
      restartPolicy: Always
      args:
        - "--config"
        - "/etc/botbox/config.yaml"
      securityContext:
        runAsUser: 1337
        runAsNonRoot: true
      ports:
        - containerPort: 8080
          name: proxy
        - containerPort: 9090
          name: metrics
      readinessProbe:
        httpGet:
          path: /healthz
          port: 9090
        initialDelaySeconds: 1
        periodSeconds: 2
      volumeMounts:
        - name: secrets
          mountPath: /var/run/secrets/botbox
          readOnly: true
        - name: config
          mountPath: /etc/botbox
          readOnly: true
  containers:
    - name: curl-client
      image: curlimages/curl:8.11.1
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
      command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for botbox to be ready..."
          for i in $(seq 1 30); do
            if curl -sf --connect-timeout 10 --max-time 30 http://127.0.0.1:9090/healthz > /dev/null 2>&1; then
              echo "Proxy is ready!"
              break
            fi
            echo "Attempt $i: proxy not ready, sleeping 2s..."
            sleep 2
          done
          echo "--- Sending request through proxy ---"
          curl -v --connect-timeout 10 --max-time 30 http://api.openai.com/v1/models 2>&1
          EXIT_CODE=$?
          echo ""
          echo "--- curl exit code: $EXIT_CODE ---"
          echo "--- Done ---"
  volumes:
    - name: secrets
      secret:
        secretName: botbox-secrets
    - name: config
      configMap:
        name: botbox-config
