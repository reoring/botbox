apiVersion: v1
kind: ConfigMap
metadata:
  name: botbox-config
  namespace: botbox-https-interception
data:
  config.yaml: |
    listen_addr: "127.0.0.1"
    listen_port: 8080
    metrics_port: 9090
    secrets_dir: "/var/run/secrets/botbox"
    max_connections: 1024
    allow_non_loopback: false

    egress_policy:
      default_action: deny
      rules:
        - host: api.openai.com
          action: allow
          header_rewrites:
            - name: Authorization
              value: "Bearer {value}"
              secret_ref: openai-api-key

    https_interception:
      enabled: true
      listen_addr: "127.0.0.1"
      listen_port: 8443
      ca_cert_path: "/etc/botbox/https_interception/ca.crt"
      ca_key_path: "/etc/botbox/https_interception/ca.key"
